name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # The colours are generated from drover-core/design/tokens.json; check them against its main branch.
      - uses: actions/checkout@v4
        with: { repository: doquangthanh/drover-core, ref: main, path: drover-core }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generated colours match drover-core/design/tokens.json
        run: node drover-core/design/gen-tokens.mjs --check --require --only web --web frontend
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test
        env: { DROVER_CORE_DIR: "${{ github.workspace }}/drover-core" }
  window:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the Tauri window
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: rustup show active-toolchain || rustup toolchain install
        working-directory: rust
      - run: cargo check --locked -p drover-desktop
        working-directory: rust
