[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# drover-daemon needs the same patched portable-pty as drover-core (ConPTY INHERIT_CURSOR fix, see that repo's rust/Cargo.toml).
[patch.crates-io]
portable-pty = { git = "https://github.com/doquangthanh/drover-core", tag = "v0.2.2" }
