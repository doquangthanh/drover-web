[package]
name = "drover-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "drover"
path = "src/main.rs"

[dependencies]
drover-daemon = { git = "https://github.com/doquangthanh/drover-core", tag = "v0.2.8" }
serde_json = "1.0.154"
tauri = "2.12.6"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"

[build-dependencies]
tauri-build = "2.7.5"

# Same gtk as tauri, only to ask for the dark window frame on Linux (`set_dark_title`).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
